name: Build Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pillow pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Download FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force packaging\ffmpeg | Out-Null
          Get-ChildItem ffmpeg-tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination packaging\ffmpeg
      - name: Build app
        run: python packaging/build.py
      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT";
          else echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi
      - name: Build installer
        run: iscc /DAppVersion=${{ steps.version.outputs.value }} packaging\installer.iss
      - name: Zip portable version
        shell: pwsh
        run: Compress-Archive dist\YouTubeDownloader dist\YouTubeDownloader-portable-${{ steps.version.outputs.value }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-${{ steps.version.outputs.value }}
          path: |
            dist/YouTubeDownloader-Setup-*.exe
            dist/YouTubeDownloader-portable-*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YouTubeDownloader-Setup-*.exe
            dist/YouTubeDownloader-portable-*.zip
